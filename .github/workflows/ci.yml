name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le workflow ne fait que lire le dépôt : aucun droit d'écriture, aucun secret
permissions:
  contents: read

# Un nouveau push annule la CI encore en cours sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run couverture
        if: matrix.node == 24
      - run: npm audit --omit=dev --audit-level=high

  # Construit l'image Docker de prod et vérifie qu'elle est saine (sans token : le bot n'est pas lancé)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t bot-discord:ci .
      - name: L'image tourne sans root
        run: test "$(docker run --rm --entrypoint id bot-discord:ci -u)" = "1000"
      - name: Aucun secret ni donnée dans l'image
        run: |
          set -e
          docker run --rm --entrypoint sh bot-discord:ci -c 'ls -a /app' > contenu.txt
          cat contenu.txt
          grep -qx 'main.js' contenu.txt
          ! grep -qE '^\.env|^\.git$|^config\.js$|\.db$' contenu.txt || (echo "Fichier interdit dans l'image" && exit 1)
          # data/ et backups/ existent (créés vides pour les volumes) mais ne doivent rien contenir
          vides="$(docker run --rm --entrypoint sh bot-discord:ci -c 'test -d /app/data && test -d /app/backups && ls -A /app/data /app/backups | grep -v ":$" | grep -c . || true')"
          test "$vides" = "0"
      - name: Les dépendances de prod se chargent
        run: docker run --rm --entrypoint node bot-discord:ci -e "require('discord.js'); require('ms'); console.log('ok')"
      # Toutes les commandes doivent se charger dans l'image (un fichier exclu par .dockerignore ferait planter le bot)
      - name: Toutes les commandes se chargent dans l'image
        run: |
          docker run --rm -e DATABASE_PATH=:memory: --entrypoint node bot-discord:ci --disable-warning=ExperimentalWarning -e "
            const D = require('discord.js'); const bot = { commands: new D.Collection() }
            require('./Loader/loadCommands')(bot, { silencieux: true })
            const attendu = require('./Loader/loadCommands').listerCommandes().length
            if (bot.commands.size !== attendu) throw new Error(bot.commands.size + ' commandes sur ' + attendu)
            console.log(bot.commands.size + ' commandes chargées')"
      - name: Le bot refuse de démarrer sans token
        run: |
          set +e
          docker run --rm bot-discord:ci > sortie.txt 2>&1
          code=$?
          cat sortie.txt
          test $code -eq 1 && grep -q "DISCORD_TOKEN manquant" sortie.txt
