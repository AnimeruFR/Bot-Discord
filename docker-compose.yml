# Production : docker compose up -d --build
# Avant le premier lancement sur le serveur :
#   cp .env.prod.example .env.prod && chmod 600 .env.prod   (puis remplir le token)
#   mkdir -p data backups && sudo chown 1000:1000 data backups   (l'utilisateur "node" du conteneur)
services:
  bot:
    build: .
    image: bot-discord:latest
    container_name: bot-discord
    restart: unless-stopped
    # Les variables sont lues au démarrage du conteneur : le fichier n'est jamais copié dans l'image
    env_file: .env.prod
    environment:
      # Les chemins internes au conteneur priment sur ceux du .env.prod
      DATABASE_PATH: /app/data/bot.db
      BACKUP_DIR: /app/backups
      HEARTBEAT_FILE: /tmp/heartbeat
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    # Durcissement : système de fichiers en lecture seule (sauf les volumes et /tmp), aucun privilège
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
